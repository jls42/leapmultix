name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simuler le déploiement sans rien écrire sur S3'
        type: boolean
        default: false
      test_notif:
        description: "Envoyer l'alerte Telegram de test (vérifie secrets et chemin d'envoi)"
        type: boolean
        default: false

# Jeton GitHub en lecture seule pour tous les jobs ; deploy y ajoute seulement
# id-token, pour l'échange OIDC avec AWS.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # Le npm du poste et de Dependabot, qui écrivent package-lock.json : le npm 10 livré
      # avec Node 22 traite autrement les dépendances pairs optionnelles, et npm ci refusait
      # leur verrou (Lighthouse 13 : « Missing: proxy-agent@8.0.2 from lock file »)
      - name: Setup npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Lint + Tests + Coverage
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify

      - name: Check formatting
        run: npm run format:check

  seo-report:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # npm du poste et de Dependabot (voir le job verify)
      - name: Setup npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.13.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      # CHROME_PATH : chrome-launcher prend le Chrome installé ci-dessus, pas celui de l'image
      - name: Run Lighthouse SEO report
        env:
          SEO_REPORT_BASE_URL: https://leapmultix.jls42.org
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run seo:report

  # Images du site, générées sans aucun droit AWS : ce job exécute le code des dépendances
  # npm (sharp…), il ne reçoit donc pas de jeton OIDC. Le job deploy, qui en reçoit un,
  # n'exécute que le code du dépôt (deploy.sh, scripts/version-module-urls.mjs) et l'AWS CLI.
  images:
    name: Images du site
    runs-on: ubuntu-24.04
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # npm du poste et de Dependabot (voir le job verify)
      - name: Setup npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.13.0

      - name: Install dependencies
        # --ignore-scripts : défense en profondeur contre une dépendance
        # compromise qui s'exécuterait à l'installation. Vérifié : sharp charge
        # ses binaires préconstruits sans script d'installation, la génération
        # d'images et les tests passent à l'identique.
        run: npm ci --ignore-scripts --no-audit --no-fund

      # assets/generated-images/ n'est pas dans git (3100+ fichiers) : il faut le
      # reconstruire ici, sinon la synchronisation S3, qui utilise --delete,
      # effacerait toutes les images du site. Environ 25 min (WebP en effort 6).
      - name: Génération des images responsives
        run: npm run assets:generate

      - name: Garde-fou avant l'envoi au job de déploiement
        run: bash scripts/check-generated-images.sh

      # Images déjà compressées (WebP, PNG) : l'archive ne les recompresse pas
      - name: Images pour le job de déploiement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-images
          path: assets/generated-images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Déploiement du site vers S3 + invalidation CloudFront, uniquement depuis main
  # et uniquement si `verify` et les images sont passés. L'authentification se fait par
  # jeton OIDC éphémère : aucune clé AWS n'est stockée dans le dépôt.
  deploy:
    name: Déploiement
    runs-on: ubuntu-24.04
    needs: images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write # échange du jeton OIDC avec AWS
      contents: read
    # Un seul déploiement à la fois, et on ne coupe pas celui qui est en cours.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Relancer un ancien run ne doit pas remettre en ligne un site dépassé : seul le commit
      # en tête de main se déploie (un commit plus récent se déploie par son propre run).
      - name: Commit en tête de main
        id: tete
        run: |
          tete=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tete" = "$GITHUB_SHA" ]; then
            echo "a_jour=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA n'est plus la tête de main ($tete) : rien n'est déployé"
            echo "a_jour=false" >> "$GITHUB_OUTPUT"
          fi

      # Échouer ici plutôt que de déployer un site amputé : sans PLAUSIBLE_DOMAIN,
      # deploy.sh retire silencieusement les scripts d'analytics.
      # Bucket, distribution et rôle AWS sont des secrets : le dépôt est public, ses journaux
      # aussi, et GitHub y masque la valeur d'un secret (numéro de compte AWS compris).
      - name: Vérification des réglages du dépôt
        if: steps.tete.outputs.a_jour == 'true'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIB: ${{ secrets.CLOUDFRONT_DISTRIB }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VOICE_BASE: ${{ vars.VOICE_BASE }}
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          manquantes=''
          for nom in S3_BUCKET CLOUDFRONT_DISTRIB PLAUSIBLE_DOMAIN VOICE_BASE ROLE_ARN; do
            [ -n "${!nom}" ] || manquantes="$manquantes $nom"
          done
          if [ -n "$manquantes" ]; then
            echo "::error::Réglages du dépôt manquants :$manquantes"
            echo "À définir dans Settings > Secrets and variables > Actions :"
            echo "secrets S3_BUCKET, CLOUDFRONT_DISTRIB, AWS_DEPLOY_ROLE_ARN (pour ROLE_ARN) ;"
            echo "variables PLAUSIBLE_DOMAIN, VOICE_BASE."
            exit 1
          fi
          echo "Réglages présents."

      # Node seul, sans npm ci : deploy.sh n'appelle que scripts/version-module-urls.mjs,
      # qui n'utilise que les modules de Node
      - name: Setup Node.js
        if: steps.tete.outputs.a_jour == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Images générées par le job images
        if: steps.tete.outputs.a_jour == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-images
          path: assets/generated-images

      - name: Garde-fou avant synchronisation
        if: steps.tete.outputs.a_jour == 'true'
        run: bash scripts/check-generated-images.sh

      - name: Outils attendus par deploy.sh
        if: steps.tete.outputs.a_jour == 'true'
        run: |
          if ! command -v rsync > /dev/null; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
          rsync --version | head -1
          aws --version
          node --version

      # Les identifiants AWS n'apparaissent qu'à partir d'ici.
      - name: Configuration des identifiants AWS (OIDC)
        if: steps.tete.outputs.a_jour == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
          mask-aws-account-id: true

      - name: Déploiement S3 + invalidation CloudFront
        if: steps.tete.outputs.a_jour == 'true'
        env:
          TF_VAR_leapmultixs3bucket: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIB: ${{ secrets.CLOUDFRONT_DISTRIB }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VOICE_BASE: ${{ vars.VOICE_BASE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # deploy.config n'est pas versionné : deploy.sh retombe alors sur les
          # variables d'environnement, ce qui est exactement ce qu'on lui fournit.
          if [ "$DRY_RUN" = 'true' ]; then
            ./deploy.sh --dry-run
          else
            ./deploy.sh
          fi

  # Notifications Telegram : site mis à jour, échec, ou test du chemin d'envoi. Un déploiement
  # raté ne casse rien en ligne, mais un run rouge ne se voit pas depuis un téléphone : cette
  # alerte en est le seul témoin. Job à part, lancé quoi qu'il arrive (always()), qui lit
  # l'issue des quatre autres dans needs. Mêmes événements que le déploiement (push ou « Run
  # workflow » sur main) : une pull request ne déploie rien.
  notifications:
    name: Notifications
    runs-on: ubuntu-24.04
    needs: [verify, seo-report, images, deploy]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      # Un job en échec : alerte. Un job annulé : alerte si ce commit est encore la tête de
      # main ; sinon un run plus récent l'a dépassé et c'est lui qui déploie (groupe de
      # concurrence deploy, ou run dépassé annulé à la main : les 18 runs annulés des 100
      # derniers de main, au 21/10/2026). Ce run compte alors comme un succès, comme le job
      # deploy qui, pour un commit dépassé, réussit sans rien envoyer. Tête de main illisible :
      # alerte, mieux vaut un ping en trop qu'une panne muette.
      - name: Bilan des jobs
        id: bilan
        if: always()
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTATS " in
            *' failure '*)
              ISSUE=echec
              ;;
            *' cancelled '*)
              # Dépôt public : la tête de main se lit sans jeton
              TETE=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
              if [ -z "$TETE" ] || [ "$TETE" = "$GITHUB_SHA" ]; then
                ISSUE=echec
              else
                ISSUE=succes
              fi
              ;;
            *)
              ISSUE=succes
              ;;
          esac
          echo "jobs : $RESULTATS -> $ISSUE"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      # Historique complet, pour comparer le push à son état antérieur, mais sans le contenu
      # des fichiers : sparse-checkout fait un clone partiel (blob:none). Le diff ne lit que les
      # arbres, moins de 3 Mo pour tout l'historique, contre plus de 800 Mo d'images et de vidéos.
      - name: Checkout repository
        if: github.event_name == 'push' && steps.bilan.outputs.issue == 'succes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: .github
          persist-credentials: false

      # Uniquement sur push, et seulement si le diff touche un fichier que deploy.sh envoie
      # (même liste que son rsync). Les commits de doc, de CI, de scripts ou de dépendances se
      # déploient en silence : le site est servi tel quel, aucune dépendance npm n'y entre, et
      # une notification qui sonne pour rien finit ignorée. Le titre du commit passe par env
      # (jamais interpolé dans le shell).
      - name: Notification de mise à jour du site
        if: github.event_name == 'push' && steps.bilan.outputs.issue == 'succes'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVANT: ${{ github.event.before }}
          TITRE: ${{ github.event.head_commit.message }}
        run: |
          # Pages, service worker, manifeste, icônes, robots.txt, sitemap.xml, et les
          # dossiers assets/, css/, img/, js/.
          SITE='^(assets|css|img|js)/|^((index|modes|offline|parents|pwa)\.html|sw\.js|manifest\.json|favicon\.(ico|png|svg)|robots\.txt|sitemap\.xml)$'
          # Ancien commit connu et aucun fichier du site touché : silence.
          # Ancien commit inconnu (force-push, historique réécrit) : on
          # notifie — mieux vaut un ping en trop qu'une mise à jour muette.
          # --no-renames : un fichier sorti du site compte, et le diff s'en tient
          # aux arbres ; -z : chemins bruts, jamais entre guillemets (accents).
          if git cat-file -e "${AVANT}^{commit}" 2>/dev/null \
            && ! git diff --name-only --no-renames -z "$AVANT" HEAD | grep -qzE "$SITE"; then
            echo "aucun changement de contenu : déploiement silencieux"
            exit 0
          fi
          TXT="✅ leapmultix.jls42.org mis à jour — $(printf '%s' "$TITRE" | head -n 1)"
          REP=$(curl -sS --max-time 25 --retry 3 --retry-delay 5 \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TXT}")
          if printf '%s' "$REP" | grep -q '"ok":true'; then
            echo "notification envoyée"
          else
            echo "::error::Telegram a refusé la notification : $REP"
            exit 1
          fi

      # Un job en échec (voir le bilan), ou le test manuel du chemin d'envoi (test_notif,
      # « Run workflow » sur main) : une alerte qu'on n'a jamais vue partir n'existe pas.
      # always() : elle part même si le run a été annulé. Un échec hors de la chaîne de
      # déploiement (le rapport SEO, qui ne la conditionne pas) laisse le job deploy réussir :
      # le message le dit, plutôt que d'annoncer un site resté en l'état (seul échec des 100
      # derniers runs de main, le 14/10/2026). La réponse de l'API est vérifiée : un refus
      # Telegram fait échouer l'étape au lieu de prétendre avoir alerté.
      - name: Alerte Telegram en cas d'échec
        if: always() && (steps.bilan.outputs.issue == 'echec' || (steps.bilan.outputs.issue == 'succes' && github.event_name == 'workflow_dispatch' && inputs.test_notif))
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE: ${{ steps.bilan.outputs.issue }}
          DEPLOIEMENT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ISSUE" != "echec" ]; then
            TXT="🔔 TEST de l'alerte CI de leapmultix.jls42.org — secrets et chemin d'envoi OK."
          elif [ "$DEPLOIEMENT" = "success" ]; then
            TXT="⛔ leapmultix.jls42.org : un job de la CI a échoué, mais le déploiement a réussi. Détail : $RUN_URL"
          elif [ "$DEPLOIEMENT" = "failure" ] || [ "$DEPLOIEMENT" = "cancelled" ]; then
            # deploy.sh a pu commencer la synchronisation S3.
            TXT="⛔ leapmultix.jls42.org : le déploiement a échoué en cours de route. Le site en ligne a pu changer. Détail : $RUN_URL"
          else
            TXT="⛔ leapmultix.jls42.org : le déploiement a échoué. Le site en ligne n'a pas bougé. Détail : $RUN_URL"
          fi
          REP=$(curl -sS --max-time 25 --retry 3 --retry-delay 5 \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TXT}")
          if printf '%s' "$REP" | grep -q '"ok":true'; then
            echo "alerte envoyée"
          else
            echo "::error::Telegram a refusé l'alerte : $REP"
            exit 1
          fi
